<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Admin — Plateria 925</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#1a1a1a;font-size:14px}
    a{color:inherit;text-decoration:none}
    button{cursor:pointer;font-family:inherit}

    /* ── LOGIN ── */
    #login-screen{
      display:flex;align-items:center;justify-content:center;
      min-height:100vh;
    }
    .login-box{
      background:#fff;border:1px solid #ddd;border-radius:10px;
      padding:2.5rem 2rem;width:320px;text-align:center;
    }
    .login-box h1{font-size:1.4rem;margin-bottom:.3rem}
    .login-box p{color:#888;font-size:12px;margin-bottom:1.5rem}
    .login-box input{
      width:100%;padding:.7rem 1rem;border:1px solid #ddd;border-radius:6px;
      font-size:14px;margin-bottom:1rem;outline:none;
    }
    .login-box input:focus{border-color:#2d5a6e}
    .btn{
      width:100%;padding:.75rem;background:#2d5a6e;color:#fff;
      border:none;border-radius:6px;font-size:14px;font-weight:500;
    }
    .btn:hover{background:#1c3d4d}
    .login-err{color:#c0392b;font-size:12px;margin-top:.6rem;display:none}

    /* ── LAYOUT ── */
    #app{display:none}
    .topbar{
      background:#2d5a6e;color:#fff;
      display:flex;align-items:center;justify-content:space-between;
      padding:.9rem 2rem;
    }
    .topbar h1{font-size:1.1rem;letter-spacing:.05em}
    .topbar-right{display:flex;gap:1rem;align-items:center}
    .save-btn{
      padding:.5rem 1.2rem;background:#fff;color:#2d5a6e;
      border:none;border-radius:6px;font-weight:600;font-size:13px;
    }
    .save-btn:hover{background:#e8f0f3}
    .save-btn:disabled{opacity:.4;pointer-events:none}
    .status-msg{font-size:12px;opacity:.85}

    .container{max-width:1100px;margin:2rem auto;padding:0 1.5rem}

    /* ── TABS ── */
    .tabs{display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap}
    .tab{
      padding:.5rem 1.1rem;border:1px solid #ddd;border-radius:2rem;
      background:#fff;font-size:13px;color:#555;
    }
    .tab.active{background:#2d5a6e;color:#fff;border-color:#2d5a6e}
    .tab:hover:not(.active){border-color:#2d5a6e;color:#2d5a6e}

    /* ── SECTION ── */
    .section{display:none}
    .section.active{display:block}

    /* ── ITEM ROW ── */
    .item-row{
      background:#fff;border:1px solid #e0e0e0;border-radius:8px;
      padding:1rem 1.2rem;margin-bottom:.6rem;
      display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
    }
    .item-img{
      width:52px;height:52px;object-fit:contain;
      border-radius:5px;border:1px solid #eee;background:#f9f9f9;flex-shrink:0;
    }
    .item-name{font-weight:500;flex:1;min-width:140px}
    .item-code{font-size:11px;color:#888}

    /* stock toggle */
    .stock-toggle{
      display:flex;align-items:center;gap:.5rem;
      padding:.4rem .9rem;border-radius:2rem;border:1px solid;
      font-size:12px;font-weight:500;white-space:nowrap;
    }
    .stock-toggle.in{background:#e8f5e9;border-color:#81c784;color:#2e7d32}
    .stock-toggle.out{background:#fce4ec;border-color:#e57373;color:#c62828}

    /* price input */
    .price-wrap{display:flex;align-items:center;gap:.4rem}
    .price-wrap span{font-size:13px;color:#555}
    .price-input{
      width:90px;padding:.35rem .6rem;border:1px solid #ddd;border-radius:5px;
      font-size:13px;text-align:right;outline:none;
    }
    .price-input:focus{border-color:#2d5a6e}

    /* sizes table */
    .sizes-wrap{width:100%;margin-top:.6rem;padding-top:.6rem;border-top:1px solid #f0f0f0}
    .sizes-grid{display:flex;gap:.5rem;flex-wrap:wrap}
    .size-pill{
      display:flex;align-items:center;gap:.4rem;
      padding:.3rem .75rem;border-radius:2rem;border:1px solid;
      font-size:12px;cursor:pointer;user-select:none;
    }
    .size-pill.in{background:#e8f5e9;border-color:#81c784;color:#2e7d32}
    .size-pill.out{background:#fce4ec;border-color:#e57373;color:#c62828;text-decoration:line-through;opacity:.7}
    .size-price-row{display:flex;align-items:center;gap:.4rem;margin-top:.4rem}
    .size-label{font-size:11px;color:#888;min-width:60px}

    /* unsaved dot */
    .unsaved{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e67e22;margin-left:.4rem;vertical-align:middle}

    /* ── ADD PRODUCT FORM ── */
    .add-form{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:1.5rem;max-width:620px}
    .add-form h2{font-size:1rem;font-weight:600;margin-bottom:1.2rem;color:#2d5a6e}
    .form-row{display:flex;flex-direction:column;gap:.3rem;margin-bottom:1rem}
    .form-row label{font-size:12px;font-weight:500;color:#555;letter-spacing:.04em;text-transform:uppercase}
    .form-row input,.form-row select,.form-row textarea{
      padding:.55rem .8rem;border:1px solid #ddd;border-radius:6px;
      font-size:13px;font-family:inherit;outline:none;
    }
    .form-row input:focus,.form-row select:focus{border-color:#2d5a6e}
    .form-row textarea{resize:vertical;min-height:70px}
    .form-row-inline{display:flex;gap:.8rem;flex-wrap:wrap}
    .form-row-inline .form-row{flex:1;min-width:140px}
    .sizes-builder{display:flex;flex-direction:column;gap:.5rem;margin-top:.4rem}
    .size-entry{display:flex;gap:.5rem;align-items:center}
    .size-entry input{flex:1;padding:.45rem .7rem;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:none}
    .size-entry input:focus{border-color:#2d5a6e}
    .rm-size{background:none;border:none;color:#c0392b;font-size:18px;line-height:1;padding:0 4px}
    .add-size-btn{
      align-self:flex-start;padding:.4rem .9rem;border:1px dashed #aaa;
      border-radius:6px;background:none;font-size:12px;color:#666;
    }
    .add-size-btn:hover{border-color:#2d5a6e;color:#2d5a6e}
    .img-preview{width:80px;height:80px;object-fit:contain;border:1px solid #eee;border-radius:6px;background:#f9f9f9;display:none;margin-top:.5rem}
    .submit-btn{
      padding:.7rem 1.6rem;background:#2d5a6e;color:#fff;
      border:none;border-radius:6px;font-size:13px;font-weight:600;
    }
    .submit-btn:hover{background:#1c3d4d}
    .submit-btn:disabled{opacity:.4;pointer-events:none}
    .add-msg{font-size:13px;margin-top:.7rem;display:none}
    .add-msg.ok{color:#2e7d32}
    .add-msg.err{color:#c0392b}
    .tab-add{background:#2d5a6e;color:#fff;border-color:#2d5a6e}
    .tab-add:hover{background:#1c3d4d!important;color:#fff!important}
    .drag-over{outline:2px dashed #2d5a6e;background:#e8f0f3}

</head>

    <input type="password" id="pw-input" placeholder="Contraseña" onkeydown="if(event.key==='Enter')tryLogin()"/>
    <input type="password" id="token-input" placeholder="GitHub Token (ghp_...)" onkeydown="if(event.key==='Enter')tryLogin()" style="margin-bottom:1rem"/>
    <button class="btn" onclick="tryLogin()">Entrar</button>
    <div class="login-err" id="login-err">Contraseña o token incorrecto</div>
  </div>
</div>

<!-- APP -->
<div id="app">

    </div>
  </div>

  <div class="container">
    <div class="tabs" id="tabs"></div>
    <div id="sections"></div>
  </div>
</div>

/* ── LOGIN ── */
function tryLogin(){
  const pw    = document.getElementById('pw-input').value;
  const token = document.getElementById('token-input').value.trim();
  if(pw === ADMIN_PASSWORD && token.startsWith('ghp_')){
    GH_TOKEN = token;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initApp();
  } else {
    document.getElementById('login-err').style.display = 'block';

/* ── STATE ── */
let stockData = {};   // loaded from stock.json
let dirty = false;

function markDirty(){
  dirty = true;
  document.getElementById('save-btn').disabled = false;
  document.getElementById('status-msg').textContent = 'Cambios sin guardar';
}

function fmt(n){ return '$' + n.toLocaleString('es-AR'); }

/* ── INIT ── */
async function initApp(){
  setStatus('Cargando stock…');
  await loadStock();
  renderTabs();
  renderSections();
  setStatus('');
}

/* ── LOAD stock.json from GitHub ── */
async function loadStock(){
  try {
    const res = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${STOCK_FILE}`, {
      headers:{ Authorization:`token ${GH_TOKEN}`, Accept:'application/vnd.github.v3+json' }
    });
    if(res.ok){
      const json = await res.json();
      stockData = JSON.parse(atob(json.content));
    } else {
      stockData = {};
    }
  } catch(e){
    stockData = {};
  }
}

/* ── GET stock value ── */
function isInStock(id){ return stockData[id]?.stock !== false; }
function getPrice(id, defaultPrice){
  return stockData[id]?.price ?? defaultPrice;
}

/* ── SET stock ── */
function setStock(id, val){
  if(!stockData[id]) stockData[id] = {};
  stockData[id].stock = val;
  markDirty();
}
function setPrice(id, val){
  if(!stockData[id]) stockData[id] = {};
  stockData[id].price = val;
  markDirty();
}

/* ── SAVE to GitHub ── */
async function saveToGitHub(){
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  setStatus('Guardando…');

  const content = btoa(unescape(encodeURIComponent(JSON.stringify(stockData, null, 2))));

  // get current SHA
  let sha = null;
  try {
    const r = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${STOCK_FILE}`, {
      headers:{ Authorization:`token ${GH_TOKEN}`, Accept:'application/vnd.github.v3+json' }
    });
    if(r.ok){ const j = await r.json(); sha = j.sha; }
  } catch(e){}

  const body = { message:'Admin: update stock', content };
  if(sha) body.sha = sha;

  const res = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${STOCK_FILE}`, {
    method:'PUT',
    headers:{
      Authorization:`token ${GH_TOKEN}`,
      Accept:'application/vnd.github.v3+json',
      'Content-Type':'application/json'
    },
    body: JSON.stringify(body)
  });

  if(res.ok){
    dirty = false;
    setStatus('✓ Guardado — el sitio se actualiza en ~1 min');
    setTimeout(() => setStatus(''), 4000);
  } else {
    setStatus('✗ Error al guardar');
    btn.disabled = false;
  }
}

function setStatus(msg){ document.getElementById('status-msg').textContent = msg; }

/* ── RENDER TABS ── */
function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';

  // Built-in sections
  SECTIONS.forEach((sec, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (i===0?' active':'');
    btn.dataset.tabid = sec.id;
    btn.textContent = sec.label;
    btn.onclick = () => switchTab(sec.id);
    tabsEl.appendChild(btn);
  });

  // Admin-created category tabs
  const newCats = stockData._newCategories || [];
  newCats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.dataset.tabid = cat.id;
    btn.textContent = cat.label;
    btn.onclick = () => switchTab(cat.id);
    tabsEl.appendChild(btn);
  });

  // Action tabs
  const addProdBtn = document.createElement('button');
  addProdBtn.className = 'tab tab-add';
  addProdBtn.dataset.tabid = '__add__';
  addProdBtn.textContent = '+ Agregar Producto';
  addProdBtn.onclick = () => switchTab('__add__');
  tabsEl.appendChild(addProdBtn);

  const addCatBtn = document.createElement('button');
  addCatBtn.className = 'tab tab-add';
  addCatBtn.dataset.tabid = '__addcat__';
  addCatBtn.textContent = '+ Nueva Categoría';
  addCatBtn.onclick = () => switchTab('__addcat__');
  tabsEl.appendChild(addCatBtn);
}

function switchTab(id){
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tabid === id);
  });
  document.querySelectorAll('.section').forEach(s => {
    s.classList.toggle('active', s.dataset.id === id);
  });
}

/* ── RENDER ALL SECTIONS ── */
function renderSections(){
  const container = document.getElementById('sections');
  container.innerHTML = '';

  // Built-in sections
  SECTIONS.forEach((sec, i) => {
    const div = document.createElement('div');
    div.className = 'section' + (i===0?' active':'');
    div.dataset.id = sec.id;
    div.innerHTML = renderBuiltinSection(sec);
    container.appendChild(div);
    attachEvents(div, sec);
  });

  // Admin-created category sections (Bug Fix 2 + Feature 1)
  (stockData._newCategories || []).forEach(cat => {
    const div = document.createElement('div');
    div.className = 'section';
    div.dataset.id = cat.id;
    div.innerHTML = renderNewCatSection(cat);
    container.appendChild(div);
    attachEvents(div, null);
  });

  // Add product section
  const addDiv = document.createElement('div');
  addDiv.className = 'section';
  addDiv.dataset.id = '__add__';
  addDiv.innerHTML = renderAddProductSection();
  container.appendChild(addDiv);

  // Add category section (Feature 1)
  const addCatDiv = document.createElement('div');
  addCatDiv.className = 'section';
  addCatDiv.dataset.id = '__addcat__';
  addCatDiv.innerHTML = renderAddCategorySection();
  container.appendChild(addCatDiv);
}

/* ── CATEGORY EDIT (Feature 2) ── */
function saveCatEdit(catId, isNew){
  const label = document.getElementById('edit-label-' + catId)?.value.trim();
  const img   = document.getElementById('edit-img-' + catId)?.value.trim();
  if(!label) return;

  if(isNew){
    const cats = stockData._newCategories || [];
    const cat  = cats.find(c => c.id === catId);
    if(cat){
      cat.label = label;
      if(img !== undefined) cat.headerImg = img;
    }
  } else {
    if(!stockData._catOverrides) stockData._catOverrides = {};
    stockData._catOverrides[catId] = { label, img };
  }
  markDirty();
  setStatus('Edición guardada — presioná "Guardar cambios" para publicar.');
}

function deleteNewProduct(idx){
  if(!confirm('¿Eliminar este producto?')) return;
  stockData._newProducts.splice(idx, 1);
  markDirty();
  renderTabs();
  renderSections();
}

  } else {
    preview.style.display = 'none';
  }
}

async function submitNewProduct(){
  const name    = document.getElementById('add-name').value.trim();
  const code    = document.getElementById('add-code').value.trim();
  const cat     = document.getElementById('add-cat').value;
  const type    = document.getElementById('add-type').value;
  const imgFile = document.getElementById('add-img').files[0];
  const btn     = document.getElementById('add-submit-btn');

  if(!name || !code){ showMsg('add-msg','err','Completá el nombre y el código.'); return; }

  let price = null;
  let sizes = null;

  if(type === 'fixed'){
    price = parseInt(document.getElementById('add-price').value, 10);
    if(isNaN(price) || price <= 0){ showMsg('add-msg','err','Ingresá un precio válido.'); return; }
  } else {
    sizes = [];
    document.querySelectorAll('#sizes-builder .size-entry').forEach(row => {
      const inputs = row.querySelectorAll('input');
      const label  = inputs[0].value.trim();
      const p      = parseInt(inputs[1].value, 10);
      if(label && !isNaN(p) && p > 0) sizes.push({ l: label, p });
    });
    if(sizes.length === 0){ showMsg('add-msg','err','Agregá al menos un talle con precio.'); return; }
  }

  btn.disabled = true;
  showMsg('add-msg','','Guardando…');

  let imgPath = '';
  if(imgFile){
    imgPath = await uploadImageToGitHub(imgFile, code);
    if(!imgPath){ btn.disabled = false; return; }
  }

  const newProduct = {
    _added: true,
    name,
    code,
    category: cat,
    productType: type,
    img: imgPath,
    _order: (stockData._newProducts || []).filter(p => p.category === cat).length,
    ...(type === 'fixed' ? { price, stock: true } : { sizes, stock: true })
  };

  if(!stockData._newProducts) stockData._newProducts = [];
  stockData._newProducts.push(newProduct);
  markDirty();
  await saveToGitHub();

  showMsg('add-msg','ok',`✓ "${name}" agregado.`);
  btn.disabled = false;

  document.getElementById('add-name').value = '';
  document.getElementById('add-code').value = '';
  document.getElementById('add-price').value = '';
  document.getElementById('add-img').value = '';
  document.getElementById('add-img-preview').style.display = 'none';
  document.getElementById('sizes-builder').innerHTML = `
    <div class="size-entry">
      <input type="text" placeholder="Talle (Ej: N°1 · 10mm)" style="flex:2"/>
      <input type="number" placeholder="Precio" style="flex:1" step="100"/>
      <button class="rm-size" onclick="this.closest('.size-entry').remove()">×</button>
    </div>`;

  renderTabs();
  renderSections();
  switchTab(cat);
}

async function submitNewCategory(){
  const id    = document.getElementById('addcat-id').value.trim().replace(/\s+/g,'-').toLowerCase();
  const label = document.getElementById('addcat-label').value.trim();
  const imgUrl  = document.getElementById('addcat-img-url').value.trim();
  const imgFile = document.getElementById('addcat-img-file').files[0];
  const btn   = document.getElementById('addcat-submit-btn');

  if(!id || !label){ showMsg('addcat-msg','err','Completá el ID y el nombre.'); return; }

  const allIds = [...SECTIONS.map(s=>s.id), ...(stockData._newCategories||[]).map(c=>c.id)];
  if(allIds.includes(id)){ showMsg('addcat-msg','err','Ese ID ya existe.'); return; }

  btn.disabled = true;
  showMsg('addcat-msg','','Guardando…');

  let headerImg = imgUrl || '';
  if(imgFile && !imgUrl){
    const path = await uploadImageToGitHub(imgFile, 'cat-' + id);
    if(path) headerImg = path;
  }

  if(!stockData._newCategories) stockData._newCategories = [];
  stockData._newCategories.push({ id, label, headerImg });
  markDirty();
  await saveToGitHub();

  showMsg('addcat-msg','ok',`✓ Categoría "${label}" creada.`);
  btn.disabled = false;

  document.getElementById('addcat-id').value = '';
  document.getElementById('addcat-label').value = '';
  document.getElementById('addcat-img-url').value = '';
  document.getElementById('addcat-img-file').value = '';
  document.getElementById('addcat-img-preview').style.display = 'none';

  renderTabs();
  renderSections();
  switchTab(id);
}

async function uploadImageToGitHub(file, code){
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = async e => {
      const base64 = e.target.result.split(',')[1];
      const ext    = file.name.split('.').pop().toLowerCase();
      const path   = `media/${code.toLowerCase()}.${ext}`;

      let sha = null;
      try {
        const check = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${path}`, {
          headers:{ Authorization:`token ${GH_TOKEN}`, Accept:'application/vnd.github.v3+json' }
        });
        if(check.ok){ const j = await check.json(); sha = j.sha; }
      } catch(e){}

      const body = { message:`Admin: add image ${code}`, content: base64 };
      if(sha) body.sha = sha;

      const res = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${path}`, {
        method:'PUT',
        headers:{
          Authorization:`token ${GH_TOKEN}`,
          Accept:'application/vnd.github.v3+json',
          'Content-Type':'application/json'
        },
        body: JSON.stringify(body)
      });

      if(res.ok){ resolve(path); }
      else { showMsg('add-msg','err','✗ Error al subir la imagen.'); resolve(null); }
    };
    reader.readAsDataURL(file);
  });
}

function showMsg(elId, type, text){
  const el = document.getElementById(elId);
  if(!el) return;
  el.textContent = text;
  el.className = 'add-msg' + (type ? ' ' + type : '');
  el.style.display = text ? 'block' : 'none';
}

/* ── ATTACH EVENTS (stock toggles, price inputs, drag-to-reorder) ── */
function attachEvents(div, sec){
  div.querySelectorAll('.stock-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const cur = isInStock(id);
      setStock(id, !cur);
      btn.className = 'stock-toggle ' + (!cur?'in':'out');
      btn.textContent = !cur ? '✓ En stock' : '✗ Sin stock';
    });
  });

  div.querySelectorAll('.size-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      const id = pill.dataset.id;
      const cur = isInStock(id);
      setStock(id, !cur);
      pill.className = 'size-pill ' + (!cur?'in':'out');
      pill.textContent = (!cur?'✓ ':'✗ ') + pill.textContent.trim().slice(2);
    });
  });

  div.querySelectorAll('.price-input').forEach(input => {
    input.addEventListener('change', () => {
      const id = input.dataset.id;
      if(!id) return;
      const val = parseInt(input.value, 10);
      if(!isNaN(val) && val > 0) setPrice(id, val);
    });
  });

  /* ── Drag-to-reorder (Feature 4) ── */
  div.querySelectorAll('[data-newprod-idx]').forEach(row => {
    row.addEventListener('dragstart', e => {
      _dragSrc = row;
      e.dataTransfer.effectAllowed = 'move';
      row.style.opacity = '.4';
    });
    row.addEventListener('dragend', () => {
      row.style.opacity = '';
      div.querySelectorAll('[data-newprod-idx]').forEach(r => r.classList.remove('drag-over'));
    });
    row.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      div.querySelectorAll('[data-newprod-idx]').forEach(r => r.classList.remove('drag-over'));
      row.classList.add('drag-over');
    });
    row.addEventListener('drop', e => {
      e.preventDefault();
      if(_dragSrc === row) return;
      const srcIdx = parseInt(_dragSrc.dataset.newprodIdx);
      const dstIdx = parseInt(row.dataset.newprodIdx);
      const prods  = stockData._newProducts;
      const [moved] = prods.splice(srcIdx, 1);
      prods.splice(dstIdx, 0, moved);
      // rewrite _order within category
      const cat = moved.category;
      let order = 0;
      prods.forEach(p => { if(p.category === cat) p._order = order++; });
      markDirty();
      renderTabs();
      renderSections();
      switchTab(cat);
    });
  });
}
</script>
